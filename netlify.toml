# Deploy del Command Center (cartella command-center) su Netlify.
# Netlify legge questo file da solo: base, build e publish sono già pronti.
[build]
  base = "command-center"
  command = "npm run build"
  publish = "dist"

# App a pagina singola: ogni URL torna all'index.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
